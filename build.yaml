---
# build.yaml para GitHub Actions (zmk-config)
# Activa ZMK Studio SOLO en la mitad izquierda (central), como recomienda la documentación oficial.
include:
  - board: nice_nano_v2
    shield: lily58_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: lily58_left_studio

  - board: nice_nano_v2
    shield: lily58_right
    artifact-name: lily58_right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
